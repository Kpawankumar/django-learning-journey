<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <form class="col-6 mx-auto card p-3 shadow-lg"
          method="post"
          enctype="multipart/form-data">

        {% csrf_token %}

        <h2>Add Receipe</h2>
        <hr>

        <div class="mb-3">

            <label for="receipe_name" class="form-label">
                Receipe Name
            </label>

            <input
                id="receipe_name"
                name="receipe_name"
                required
                type="text"
                class="form-control">

        </div>

        <div class="mb-3">

            <label for="receipe_description" class="form-label">
                Recipe Description
            </label>

            <textarea
                id="receipe_description"
                name="receipe_description"
                class="form-control"
                rows="4"></textarea>

        </div>

        <div class="mb-3">

            <label for="receipe_image" class="form-label">
                Recipe Image
            </label>

            <input
                id="receipe_image"
                name="receipe_image"
                type="file"
                class="form-control">

        </div>

        <button type="submit" class="btn btn-success">
            Add Receipe
        </button>

    </form>

    {{receipes}}
</div>

</body>
</html>
